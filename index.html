<title>Course Glossary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>
/* ==========================================================================
   EDIT YOUR GLOSSARY HERE
   --------------------------------------------------------------------------
   To add a term, copy the template at the bottom of the list, paste it
   above the template, and fill it in.
     term        : the word, phrase or abbreviation (required)
     full        : the full form if it is an abbreviation, otherwise ""
     definition  : a plain-language explanation (required)
     week        : a number from 1 to 12
   The page sorts terms A to Z by itself.
   Keep the comma after each closing curly bracket.
   ========================================================================== */
const SITE_TITLE    = "Cybersecurity Governance Glossary";
const SITE_SUBTITLE = "Abbreviations, terms and phrases, updated every week";
const TOTAL_WEEKS   = 12;

const TERMS = [
  { term: "AC", full: "Attack Complexity",
    definition: "CVSS metric rating how hard it is to exploit a flaw, based on conditions the attacker cannot control (Low or High).",
    week: 2 },

  { term: "ACSC", full: "Australian Cyber Security Centre",
    definition: "Australia's main government body for cyber security advice and incident response, part of the ASD. Publishes the yearly cyber threat report.",
    week: 2 },

  { term: "AI", full: "Artificial Intelligence",
    definition: "Computer systems that perform tasks normally needing human thinking. Attackers now use it for realistic phishing messages and cloned voices.",
    week: 2 },

  { term: "ALE", full: "Annualised Loss Expectancy",
    definition: "The loss you expect from a risk in one year, calculated as SLE multiplied by ARO. Helps compare the cost of a control with the loss it prevents.",
    week: 2 },

  { term: "API", full: "Application Programming Interface",
    definition: "A set of rules that lets one software system request data from another. APIs that allow too much access are a common cause of breaches.",
    week: 2 },

  { term: "APP", full: "Australian Privacy Principles",
    definition: "The 13 rules in Australia's Privacy Act 1988 for handling personal information. APP 1, APP 8 and APP 11 were relevant in the Qantas inquiry.",
    week: 2 },

  { term: "ARO", full: "Annualised Rate of Occurrence",
    definition: "How many times a loss event is expected to happen per year. For example, 0.2 means about once every five years.",
    week: 2 },

  { term: "ASD", full: "Australian Signals Directorate",
    definition: "Australian Government agency for signals intelligence and cyber security. It runs the ACSC and publishes the Essential Eight.",
    week: 2 },

  { term: "AT", full: "Attack Requirements",
    definition: "CVSS v4.0 metric for whether special conditions on the target system are needed for an attack to work (None or Present).",
    week: 2 },

  { term: "ATT&CK", full: "Adversarial Tactics, Techniques, and Common Knowledge",
    definition: "MITRE's public library of how real attackers operate. It gives more detail than the Cyber Kill Chain.",
    week: 2 },

  { term: "AUD", full: "Australian Dollar",
    definition: "The currency used for the Qantas figures in the case study.",
    week: 2 },

  { term: "AV", full: "Attack Vector",
    definition: "CVSS metric for how close an attacker must be to exploit a flaw: Network, Adjacent, Local or Physical. In loss formulas, AV can instead mean asset value.",
    week: 2 },

  { term: "BCP", full: "Business Continuity Plan",
    definition: "A plan to keep the whole organisation running during a disruption, covering operations, suppliers, communication and staff. Wider in scope than a DRP.",
    week: 2 },

  { term: "C2", full: "Command and Control",
    definition: "The kill chain stage where the attacker sets up a remote connection to control systems inside the victim's network.",
    week: 2 },

  { term: "CDO", full: "Chief Data Officer",
    definition: "Senior executive responsible for how data is governed, kept accurate and used across the organisation.",
    week: 2 },

  { term: "CFO", full: "Chief Financial Officer",
    definition: "Senior executive responsible for finance, including making sure transactions and balances are correct.",
    week: 2 },

  { term: "CIA", full: "Confidentiality, Integrity, Availability",
    definition: "The three main goals of information security, used to classify assets and judge the impact of an incident.",
    week: 2 },

  { term: "CISA", full: "Cybersecurity and Infrastructure Security Agency",
    definition: "US government agency that runs the Known Exploited Vulnerabilities (KEV) catalog.",
    week: 2 },

  { term: "CISO", full: "Chief Information Security Officer",
    definition: "Senior executive who leads the security program and reports cyber risk to the board.",
    week: 2 },

  { term: "CMDB", full: "Configuration Management Database",
    definition: "A store of IT components such as servers and software and how they connect. A useful base for an asset inventory, but it usually lacks business classification.",
    week: 2 },

  { term: "CRM", full: "Customer Relationship Management",
    definition: "A system holding customer details, contact history and service records. Qantas's cloud CRM was the system accessed in the 2025 incident.",
    week: 2 },

  { term: "CSF", full: "Cybersecurity Framework",
    definition: "NIST's framework for managing cyber risk. Version 2.0 (2024) has six functions: Govern, Identify, Protect, Detect, Respond and Recover.",
    week: 2 },

  { term: "CVE", full: "Common Vulnerabilities and Exposures",
    definition: "A system that gives each publicly known vulnerability a unique ID, such as CVE-2021-44228 (Log4Shell).",
    week: 2 },

  { term: "CVSS", full: "Common Vulnerability Scoring System",
    definition: "A standard from FIRST that rates how severe a vulnerability is on a 0.0 to 10.0 scale. Versions 3.1 and 4.0 are in use. It rates severity, not business risk.",
    week: 2 },

  { term: "CWE", full: "Common Weakness Enumeration",
    definition: "MITRE's list of the types of mistakes that cause vulnerabilities, such as CWE-89 for SQL injection.",
    week: 2 },

  { term: "DBIR", full: "Data Breach Investigations Report",
    definition: "Verizon's yearly study of thousands of security incidents and breaches, grouped by attack pattern, asset and industry.",
    week: 2 },

  { term: "DBS", full: "DBS Bank Ltd (originally the Development Bank of Singapore)",
    definition: "Singapore's largest bank, regulated by MAS. The course's DBS risk scenario is a made-up teaching case, not a list of the real bank's weaknesses.",
    week: 2 },

  { term: "DDoS", full: "Distributed Denial of Service",
    definition: "A denial of service attack sent from many hijacked devices at once (a botnet) to flood a service.",
    week: 2 },

  { term: "DMARC", full: "Domain-based Message Authentication, Reporting and Conformance",
    definition: "An email standard that helps stop attackers sending fake emails that appear to come from your domain.",
    week: 2 },

  { term: "DNS", full: "Domain Name System",
    definition: "The internet's address book that turns names like qantas.com into IP addresses. DNS attacks disrupt or redirect these lookups.",
    week: 2 },

  { term: "DoS", full: "Denial of Service",
    definition: "An attack that overloads a service so real users cannot reach it. It harms availability.",
    week: 2 },

  { term: "DPO", full: "Data Protection Officer",
    definition: "The person who oversees compliance with data protection law. Required in some situations under the EU GDPR.",
    week: 2 },

  { term: "DR", full: "Disaster Recovery",
    definition: "The processes and tools used to get IT systems working again after a major disruption.",
    week: 2 },

  { term: "DRP", full: "Disaster Recovery Plan",
    definition: "A documented plan for restoring IT systems after a major disruption. It sits inside the wider BCP.",
    week: 2 },

  { term: "DSS", full: "Data Security Standard",
    definition: "Part of PCI DSS, the required security standard for anyone who handles payment card data.",
    week: 2 },

  { term: "EDR", full: "Endpoint Detection and Response",
    definition: "Security software on devices that watches for suspicious behaviour, can isolate an infected device and helps investigations.",
    week: 2 },

  { term: "EF", full: "Exposure Factor",
    definition: "The share of an asset's value lost in one incident, used to calculate SLE.",
    week: 2 },

  { term: "ENISA", full: "European Union Agency for Cybersecurity",
    definition: "The EU's cyber security agency. It publishes the yearly ENISA Threat Landscape report.",
    week: 2 },

  { term: "EO", full: "Executive Order",
    definition: "An order issued by the US President. EO 13526 sets the Top Secret, Secret and Confidential classification levels.",
    week: 2 },

  { term: "EPSS", full: "Exploit Prediction Scoring System",
    definition: "A FIRST model that estimates the chance a vulnerability will be exploited within the next 30 days.",
    week: 2 },

  { term: "ETL", full: "ENISA Threat Landscape",
    definition: "ENISA's yearly report on cyber threats across the EU.",
    week: 2 },

  { term: "EU", full: "European Union",
    definition: "A political and economic union of 27 European countries.",
    week: 2 },

  { term: "FAIR", full: "Factor Analysis of Information Risk",
    definition: "A model for putting a money value on risk by combining how often loss events happen with how big the losses are.",
    week: 2 },

  { term: "FIPS", full: "Federal Information Processing Standards",
    definition: "NIST standards for US government systems. FIPS 199 rates impact as Low, Moderate or High for C, I and A; FIPS 200 sets minimum security requirements.",
    week: 2 },

  { term: "FIRST", full: "Forum of Incident Response and Security Teams",
    definition: "A global network of incident response teams. It maintains CVSS and EPSS.",
    week: 2 },

  { term: "FY", full: "Financial Year",
    definition: "A 12-month accounting period. For Qantas, FY2026 ran from 1 July 2025 to 30 June 2026.",
    week: 2 },

  { term: "GDPR", full: "General Data Protection Regulation",
    definition: "The EU's main data protection law, in force since 2018.",
    week: 2 },

  { term: "GTIG", full: "Google Threat Intelligence Group",
    definition: "Google's threat research team. It reported on the UNC6040 phone phishing campaign against Salesforce customers in 2025.",
    week: 2 },

  { term: "HR", full: "Human Resources",
    definition: "The team that manages staff, including joining, moving and leaving, which all trigger changes to system access.",
    week: 2 },

  { term: "IDS", full: "Intrusion Detection System",
    definition: "A tool that watches network or device activity and raises alerts on suspicious behaviour. It alerts but does not block.",
    week: 2 },

  { term: "IEC", full: "International Electrotechnical Commission",
    definition: "An international standards body that publishes the ISO/IEC 27000 series together with ISO.",
    week: 2 },

  { term: "IIA", full: "Institute of Internal Auditors",
    definition: "The professional body for internal auditors. It publishes the Three Lines Model.",
    week: 2 },

  { term: "IoT", full: "Internet of Things",
    definition: "Everyday devices connected to a network, such as cameras and sensors. They are often poorly secured.",
    week: 2 },

  { term: "IP", full: "Internet Protocol",
    definition: "The system of addresses for devices on a network. IP restrictions only allow logins from approved address ranges.",
    week: 2 },

  { term: "IPS", full: "Intrusion Prevention System",
    definition: "Similar to an IDS, but placed directly in the traffic path so it can block malicious activity automatically.",
    week: 2 },

  { term: "IRP", full: "Incident Response Plan",
    definition: "A written plan setting out roles, escalation, communication and the steps to contain and recover from an incident.",
    week: 2 },

  { term: "ISF", full: "Information Security Forum",
    definition: "An independent member organisation that publishes the Threat Horizon report on future threats.",
    week: 2 },

  { term: "ISO", full: "International Organization for Standardization (also: Information Security Officer)",
    definition: "As a standards body, it publishes ISO 55000 and, with IEC, ISO/IEC 27001 and 27002. As a job role, the officer who sets classification rules and maintains asset inventories.",
    week: 2 },

  { term: "IT", full: "Information Technology",
    definition: "Computers, networks and software, and the team that runs them.",
    week: 2 },

  { term: "ITS", full: "Information Technology Services",
    definition: "The IT department, used as the example owner in the asset inventory template.",
    week: 2 },

  { term: "KEV", full: "Known Exploited Vulnerabilities",
    definition: "CISA's list of vulnerabilities that attackers are known to be actively using. A strong signal to patch first.",
    week: 2 },

  { term: "KRI", full: "Key Risk Indicator",
    definition: "A measure that warns when risk is rising, for example the number of admin accounts that have not been reviewed.",
    week: 2 },

  { term: "KYC", full: "Know Your Customer",
    definition: "The identity checks banks must do when signing up new customers. It produces very sensitive identity data.",
    week: 2 },

  { term: "LMS", full: "Learning Management System",
    definition: "A platform for delivering courses and storing students' work and grades.",
    week: 2 },

  { term: "MAS", full: "Monetary Authority of Singapore",
    definition: "Singapore's central bank and financial regulator. It issues the Technology Risk Management Guidelines and Notice 644.",
    week: 2 },

  { term: "MFA", full: "Multi-Factor Authentication",
    definition: "Logging in with two or more types of proof, such as a password plus a phone code. It does not help if a user is tricked into approving a malicious app.",
    week: 2 },

  { term: "MitM", full: "Man-in-the-Middle",
    definition: "An attack where someone secretly sits between two parties to read or change their communication.",
    week: 2 },

  { term: "MITRE", full: "MITRE Corporation",
    definition: "A US not-for-profit that runs the CVE Program, CWE and ATT&CK.",
    week: 2 },

  { term: "NDB", full: "Notifiable Data Breaches scheme",
    definition: "An Australian rule requiring organisations to tell the OAIC and affected people about breaches likely to cause serious harm.",
    week: 2 },

  { term: "NIST", full: "National Institute of Standards and Technology",
    definition: "A US agency that publishes FIPS, the SP 800 series and the Cybersecurity Framework.",
    week: 2 },

  { term: "NSW", full: "New South Wales",
    definition: "An Australian state. Qantas got a court order from the NSW Supreme Court in July 2025 to stop use of the stolen data.",
    week: 2 },

  { term: "NVD", full: "National Vulnerability Database",
    definition: "NIST's database that adds detail to CVE records, including severity scores, weakness types and affected products.",
    week: 2 },

  { term: "OAIC", full: "Office of the Australian Information Commissioner",
    definition: "Australia's privacy regulator. It closed its preliminary inquiries into the Qantas incident in July 2026 without taking further action at that point.",
    week: 2 },

  { term: "OAuth", full: "Open Authorization",
    definition: "A standard that lets users give an app limited access to their account without sharing their password. Attackers abused it in the Qantas-style attacks through fake connected apps.",
    week: 2 },

  { term: "OWASP", full: "Open Worldwide Application Security Project",
    definition: "A non-profit best known for its Top 10 lists of web application and API security risks.",
    week: 2 },

  { term: "PCI", full: "Payment Card Industry",
    definition: "The card payments industry. Its security standard is PCI DSS.",
    week: 2 },

  { term: "PDPA", full: "Personal Data Protection Act 2012 (Singapore)",
    definition: "Singapore's data protection law, relevant to the DBS scenario.",
    week: 2 },

  { term: "PII", full: "Personally Identifiable Information",
    definition: "Data that can identify a person, such as their name, date of birth or address.",
    week: 2 },

  { term: "POS", full: "Point of Sale",
    definition: "Checkout terminals and software that take card payments.",
    week: 2 },

  { term: "PR", full: "Privileges Required",
    definition: "CVSS metric for how much access an attacker needs before exploiting a flaw (None, Low or High).",
    week: 2 },

  { term: "PSPF", full: "Protective Security Policy Framework",
    definition: "Australian Government security policy that defines classifications such as OFFICIAL: Sensitive, PROTECTED, SECRET and TOP SECRET.",
    week: 2 },

  { term: "PV", full: "Present Value",
    definition: "What a future amount of money is worth today after applying a discount rate.",
    week: 2 },

  { term: "RACI", full: "Responsible, Accountable, Consulted, Informed",
    definition: "A table showing who does each task, who owns it, who gives input and who is kept updated.",
    week: 2 },

  { term: "RFC", full: "Request for Comments",
    definition: "The documents that define internet standards, such as RFC 6749 for OAuth 2.0.",
    week: 2 },

  { term: "RTO", full: "Recovery Time Objective",
    definition: "The longest acceptable time to get a system working again after a disruption. MAS expects 4 hours or less for banks' critical systems.",
    week: 2 },

  { term: "SA", full: "Subsequent System Availability",
    definition: "CVSS v4.0 metric for the availability impact on other systems beyond the vulnerable one.",
    week: 2 },

  { term: "SaaS", full: "Software as a Service",
    definition: "Software run by a provider and used over the internet, such as a cloud CRM.",
    week: 2 },

  { term: "SC", full: "Security Category (FIPS 199)",
    definition: "The FIPS 199 way of writing the impact level for confidentiality, integrity and availability. In CVSS v4.0, SC also means Subsequent System Confidentiality.",
    week: 2 },

  { term: "SI", full: "Subsequent System Integrity",
    definition: "CVSS v4.0 metric for the integrity impact on other systems beyond the vulnerable one.",
    week: 2 },

  { term: "SIEM", full: "Security Information and Event Management",
    definition: "A platform that gathers logs from many systems, links related events and raises alerts.",
    week: 2 },

  { term: "SIM", full: "Subscriber Identity Module",
    definition: "The card that links a phone number to a device. In SIM-swap fraud, attackers take over a victim's number to receive their login codes.",
    week: 2 },

  { term: "SLE", full: "Single Loss Expectancy",
    definition: "The loss from one occurrence of a risk event, calculated as asset value multiplied by exposure factor.",
    week: 2 },

  { term: "SMB", full: "Server Message Block",
    definition: "A Windows file sharing protocol. The EternalBlue exploit targeted SMBv1.",
    week: 2 },

  { term: "SOC", full: "Security Operations Centre",
    definition: "The team that monitors, detects and responds to security events, usually around the clock.",
    week: 2 },

  { term: "SP", full: "Special Publication",
    definition: "A NIST document series, such as SP 800-30 on risk assessment, SP 800-53 on controls and SP 800-61 on incident response.",
    week: 2 },

  { term: "SQL", full: "Structured Query Language",
    definition: "The language used to query databases. SQL injection sneaks harmful SQL commands in through unchecked input.",
    week: 2 },

  { term: "STRIDE", full: "Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege",
    definition: "A Microsoft threat modelling checklist. Each letter is a threat type that breaks one security property.",
    week: 2 },

  { term: "TLS", full: "Transport Layer Security",
    definition: "The protocol that encrypts data while it travels across a network, as used in HTTPS.",
    week: 2 },

  { term: "TRM", full: "Technology Risk Management",
    definition: "As in the MAS TRM Guidelines (2021), which set out what MAS expects from financial institutions on technology risk, resilience and cyber security.",
    week: 2 },

  { term: "UI", full: "User Interaction",
    definition: "CVSS metric for whether someone other than the attacker has to do something for the attack to work.",
    week: 2 },

  { term: "UNC", full: "Uncategorised threat group",
    definition: "A Google/Mandiant label for attack activity not yet linked to a known group, such as UNC6040 and UNC6240.",
    week: 2 },

  { term: "USB", full: "Universal Serial Bus",
    definition: "The standard for removable drives and accessories. A common route for data leaks and malware.",
    week: 2 },

  { term: "USD", full: "United States Dollar",
    definition: "The currency used in IBM's Cost of a Data Breach figures.",
    week: 2 },

  { term: "VA", full: "Vulnerable System Availability",
    definition: "CVSS v4.0 metric for the availability impact on the vulnerable system itself.",
    week: 2 },

  { term: "VC", full: "Vulnerable System Confidentiality",
    definition: "CVSS v4.0 metric for the confidentiality impact on the vulnerable system itself.",
    week: 2 },

  { term: "VI", full: "Vulnerable System Integrity",
    definition: "CVSS v4.0 metric for the integrity impact on the vulnerable system itself.",
    week: 2 },

  { term: "VPN", full: "Virtual Private Network",
    definition: "An encrypted connection over the internet. Attackers also use commercial VPNs to hide where they are.",
    week: 2 },

  { term: "XP", full: "Experience Points",
    definition: "Points earned in the course website for completing activities.",
    week: 2 },

  { term: "XSS", full: "Cross-Site Scripting",
    definition: "A web attack that plants harmful scripts in pages that other users then load.",
    week: 2 },

  { term: "Asset", full: "",
    definition: "Anything of value an organisation needs to reach its goals, including data, software, hardware, people and reputation.",
    week: 2 },

  { term: "Asset inventory", full: "",
    definition: "A register listing every valuable asset, where it lives, who owns it and how it is protected. Also called an asset register.",
    week: 2 },

  { term: "Attack vector", full: "",
    definition: "The route or method an attacker uses to get in, such as a phishing email, a stolen password or a vulnerable app.",
    week: 2 },

  { term: "Defence in depth", full: "",
    definition: "Layering several independent controls so that if one fails, the others still protect the asset.",
    week: 2 },

  { term: "Threat agent", full: "",
    definition: "The person or thing that triggers a threat, either deliberately (a criminal) or by accident (a staff mistake).",
    week: 2 },

  { term: "Vishing", full: "Voice phishing",
    definition: "Social engineering carried out over the phone, often by pretending to be IT support or a bank.",
    week: 2 },

  /* TEMPLATE: copy the 3 lines below, paste them above this comment, fill them in
  { term: "", full: "",
    definition: "",
    week: 3 },
  */
];
</script>

<style>
  :root {
    --bg: #f6f7fb; --surface: #ffffff; --surface-2: #f0f2f8;
    --text: #141826; --muted: #5d6478; --border: #e2e5ef; --faint: #c9cedc;
    --accent: #3d5afe; --accent-soft: #e8ecff; --mark: #ffe58a;
    --new: #0f9d58; --new-soft: #e3f6ec;
    --shadow: 0 1px 2px rgba(20,24,38,.04), 0 6px 24px rgba(20,24,38,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1117; --surface: #161a23; --surface-2: #1d2230;
      --text: #e8eaf2; --muted: #9aa1b5; --border: #2a3040; --faint: #3a4152;
      --accent: #7c93ff; --accent-soft: #232b4a; --mark: #6b5a12;
      --new: #4cd38a; --new-soft: #17301f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1117; --surface: #161a23; --surface-2: #1d2230;
    --text: #e8eaf2; --muted: #9aa1b5; --border: #2a3040; --faint: #3a4152;
    --accent: #7c93ff; --accent-soft: #232b4a; --mark: #6b5a12;
    --new: #4cd38a; --new-soft: #17301f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 Inter, system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 16px 80px; }

  header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 28px; }
  .eyebrow { font: 500 12px/1 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 10px 0 6px; letter-spacing: -.02em; }
  .subtitle { color: var(--muted); margin: 0; }
  .theme-btn { flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }

  .controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0; display: grid; gap: 12px; }
  .search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0 14px; box-shadow: var(--shadow); }
  .search:focus-within { border-color: var(--accent); }
  .search svg { flex-shrink: 0; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; padding: 14px 0; }
  .search kbd { font: 12px "JetBrains Mono", monospace; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }
  .clear { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; display: none; }

  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:disabled { color: var(--faint); cursor: default; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .7; margin-left: 4px; font-size: 12px; }
  .letters { display: flex; flex-wrap: wrap; gap: 2px; }
  .letters button { width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--text); font: 600 13px Inter, sans-serif; cursor: pointer; }
  .letters button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
  .letters button:disabled { color: var(--border); cursor: default; }
  .count { color: var(--muted); font-size: 13px; }

  .group-letter { font: 700 13px "JetBrains Mono", monospace; color: var(--accent); margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); scroll-margin-top: 190px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; box-shadow: var(--shadow); display: grid; grid-template-columns: 220px 1fr; gap: 6px 24px; }
  .term { font-weight: 700; font-size: 16px; word-break: break-word; }
  .full { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .def { margin: 0; }
  .tags { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
  .tag.new { background: var(--new-soft); color: var(--new); font-weight: 600; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; text-align: center; }

  @media (max-width: 640px) {
    .card { grid-template-columns: 1fr; }
    .tags { grid-column: 1; }
    .search kbd { display: none; }
    .group-letter { scroll-margin-top: 260px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">A to Z Glossary</div>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <button class="theme-btn" id="themeBtn">Dark mode</button>
  </header>

  <div class="controls">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search terms, full forms or explanations" autocomplete="off">
      <button class="clear" id="clear" aria-label="Clear search">×</button>
      <kbd>/</kbd>
    </label>
    <div class="row" id="filters"></div>
    <div class="row" style="justify-content:space-between">
      <div class="letters" id="letters"></div>
      <span class="count" id="count"></span>
    </div>
  </div>

  <main id="list"></main>
  <footer id="footer"></footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const data = TERMS.filter(t => t.term && t.definition)
    .sort((a, b) => a.term.localeCompare(b.term, undefined, { sensitivity: "base" }));
  const latestWeek = Math.max(0, ...data.map(t => +t.week || 0));
  let activeFilter = "all";

  $("title").textContent = SITE_TITLE;
  $("subtitle").textContent = SITE_SUBTITLE;
  $("footer").textContent = latestWeek ? "Last updated: Week " + latestWeek : "";
  document.title = SITE_TITLE;

  // Filter chips: All + Week 1 to TOTAL_WEEKS (weeks with no terms yet are greyed out)
  const perWeek = w => data.filter(t => +t.week === w).length;
  let chipHtml = `<button class="chip" data-k="all" aria-pressed="true">All<span class="n">${data.length}</span></button>`;
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const n = perWeek(w);
    chipHtml += `<button class="chip" data-k="${w}" aria-pressed="false" ${n ? "" : "disabled"}>Week ${w}${n ? `<span class="n">${n}</span>` : ""}</button>`;
  }
  $("filters").innerHTML = chipHtml;
  $("filters").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b || b.disabled) return;
    activeFilter = b.dataset.k;
    $("filters").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  });

  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
  function norm(s) { return String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function highlight(text, words) {
    const html = esc(text);
    if (!words.length) return html;
    const re = new RegExp("(" + words.map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
    return html.replace(re, "<mark>$1</mark>");
  }
  function letterOf(t) { const c = t.term.trim()[0].toUpperCase(); return /[A-Z]/.test(c) ? c : "#"; }

  function render() {
    const raw = $("q").value.trim();
    const words = norm(raw).split(/\s+/).filter(Boolean);
    $("clear").style.display = raw ? "block" : "none";

    const rows = data.filter(t => {
      if (activeFilter !== "all" && String(t.week) !== activeFilter) return false;
      const hay = norm([t.term, t.full, t.definition].join(" "));
      return words.every(w => hay.includes(w));
    });

    if (words.length) {
      const q = norm(raw);
      const score = t => norm(t.term) === q ? 0 : norm(t.term).startsWith(q) ? 1 : norm(t.term).includes(q) ? 2 : 3;
      rows.sort((a, b) => score(a) - score(b) || a.term.localeCompare(b.term));
    }

    $("count").textContent = `${rows.length} of ${data.length} terms`;

    const present = new Set(rows.map(letterOf));
    $("letters").innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(L =>
      `<button data-l="${L}" ${present.has(L) ? "" : "disabled"}>${L}</button>`).join("");

    if (!rows.length) {
      $("list").innerHTML = `<div class="empty">No terms match "${esc(raw)}".</div>`;
      return;
    }

    let html = "", last = "";
    const seen = new Set();
    for (const t of rows) {
      const L = letterOf(t);
      let anchor = "";
      if (!words.length && L !== last) { html += `<div class="group-letter" id="L-${L}">${L}</div>`; last = L; }
      else if (words.length && !seen.has(L)) { anchor = ` id="L-${L}"`; seen.add(L); }
      html += `<article class="card"${anchor}>
        <div><div class="term">${highlight(t.term, words)}</div>
        ${t.full ? `<div class="full">${highlight(t.full, words)}</div>` : ""}</div>
        <p class="def">${highlight(t.definition, words)}</p>
        <div class="tags">
          ${+t.week === latestWeek ? `<span class="tag new">New</span>` : ""}
          ${t.week ? `<span class="tag">Week ${esc(t.week)}</span>` : ""}
        </div></article>`;
    }
    $("list").innerHTML = html;
  }

  $("letters").addEventListener("click", e => {
    const b = e.target.closest("button[data-l]"); if (!b) return;
    document.getElementById("L-" + b.dataset.l)?.scrollIntoView({ behavior: "smooth" });
  });
  $("q").addEventListener("input", render);
  $("clear").addEventListener("click", e => { e.preventDefault(); $("q").value = ""; render(); $("q").focus(); });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
    if (e.key === "Escape") { $("q").value = ""; render(); }
  });

  // Dark mode toggle (remembers the choice)
  const root = document.documentElement;
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  try { const s = localStorage.getItem("glossary-theme"); if (s) root.dataset.theme = s; } catch (_) {}
  const syncBtn = () => $("themeBtn").textContent = isDark() ? "Light mode" : "Dark mode";
  $("themeBtn").addEventListener("click", () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("glossary-theme", root.dataset.theme); } catch (_) {}
    syncBtn();
  });
  syncBtn();
  render();
})();
</script>
</body>
</html>
